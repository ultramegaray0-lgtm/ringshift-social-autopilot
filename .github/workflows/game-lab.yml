name: Ringshift Game Lab

# Proposes new content for the GAME; never publishes it and never posts anything.
#  - Every Monday: candidate levels generated with the game's own tracer, proven unique/solvable/coin-correct and
#    played with real key presses on a patched COPY of the stable build (scripts/level_lab.py).
#  - Every second Monday (when the last theme experiment is 13+ days old): one experimental theme written by Gemini in
#    the game's v2 theme framework and measured against the shipped themes (scripts/theme_lab.py).
#  - A candidate that passes is pushed to a NEW lab/... branch of ultramegaray0-lgtm/ringshift-game and offered as a
#    pull request. Nothing is merged: the game's main branch (the live demo) only changes when a person merges.
#  - Writing to the game repository needs the secret RINGSHIFT_GAME_TOKEN (docs/AUTOMATION.md). Without it the
#    experiments still run and are attached to the run as artifacts, and the step fails saying the token is missing.
#  - No Buffer key is used anywhere in this workflow.

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
    inputs:
      experiment:
        description: "levels = candidate levels; theme = one experimental theme (runs even if not due); both"
        required: true
        type: choice
        options:
          - levels
          - theme
          - both
        default: levels

concurrency:
  group: ringshift-game-lab
  cancel-in-progress: false

permissions:
  contents: read

env:
  GAME_REPOSITORY: ultramegaray0-lgtm/ringshift-game
  GAME_REF: main

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run offline tests (no network, no secrets)
        run: python -m unittest discover -s tests

  lab:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write      # record the lab log, the theme calibration and preview pictures in THIS repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-capture.txt

      - name: Install the game tools (Python, Chromium, FFmpeg)
        timeout-minutes: 25
        run: |
          pip install -r requirements-capture.txt
          for attempt in 1 2 3; do
            if timeout 420 python -m playwright install --with-deps chromium; then break; fi
            echo "Chromium install attempt $attempt failed; retrying in 20 s"; sleep 20
          done
          # Package mirrors occasionally stall; bounded attempts instead of one install that can hang the job.
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg; then break; fi
            echo "FFmpeg install attempt $attempt failed; retrying in 20 s"; sleep 20
          done
          command -v ffmpeg ffprobe

      - name: Check out the game (stable branch, read-only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAME_REPOSITORY }}
          ref: ${{ env.GAME_REF }}
          path: game-src
          fetch-depth: 1
          persist-credentials: false

      - name: Candidate levels
        if: github.event_name == 'schedule' || inputs.experiment == 'levels' || inputs.experiment == 'both'
        timeout-minutes: 30
        env:
          RINGSHIFT_GAME_TOKEN: ${{ secrets.RINGSHIFT_GAME_TOKEN }}
        run: |
          RINGSHIFT_STORE_AUTH_HEADER="$(git config --get http.https://github.com/.extraheader || true)" \
            python scripts/level_lab.py run --game-dir game-src --out lab-levels --open-pr

      - name: Theme experiment
        if: always() && (github.event_name == 'schedule' || inputs.experiment == 'theme' || inputs.experiment == 'both')
        timeout-minutes: 35
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RINGSHIFT_GAME_TOKEN: ${{ secrets.RINGSHIFT_GAME_TOKEN }}
          DUE: ${{ github.event_name == 'schedule' && '13' || '0' }}
        run: |
          RINGSHIFT_STORE_AUTH_HEADER="$(git config --get http.https://github.com/.extraheader || true)" \
            python scripts/theme_lab.py run --game-dir game-src --out lab-theme --open-pr --if-due "$DUE"

      - name: Keep the experiments as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringshift-game-lab
          path: |
            lab-levels/
            lab-theme/
          retention-days: 30
          if-no-files-found: ignore

      - name: Record the lab log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/game_lab.json data/theme_calibration.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "Nothing to record."; exit 0; fi
          git commit -m "Record game lab results"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main && git rebase origin/main
          done
          echo "Push failed after 5 attempts."; exit 1
