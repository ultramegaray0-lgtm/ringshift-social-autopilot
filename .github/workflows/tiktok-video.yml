name: Ringshift TikTok video

# WHAT THIS DOES
#  Makes ONE vertical (1080x1920) TikTok video, a downloadable artifact of the run; upload it to TikTok by hand.
#  Nothing is posted. Two formats, both cropped to the real Ringshift puzzle board:
#   funny    - a funny clip from media/funny/ on top with its own sound, muted gameplay underneath, a demo card
#   gameplay - gameplay only: a larger board between a "ROTATE THE RINGS" card and the demo card; silent
#  format auto (the schedule): a never-used funny clip; else an old clip that may come back (7+ days since its last
#  video, under 3 uses, with gameplay it was not shown with); else a gameplay-only video. Running out of funny clips
#  never stops the output. A video identical to an earlier one is refused.
#
# SEPARATE FROM THE X AUTOPILOT
#  Own workflow, own concurrency group, no Buffer or Gemini secret. It never commits to main or touches media-store:
#  the only thing it writes is a small state file (which clips were used) on its own branch, tiktok-state. If this
#  workflow fails, the X autopilot is unaffected.
#
# WHEN
#  Every day at 07:41 UTC (10:41 Riyadh), or by hand: Actions > Ringshift TikTok video > Run workflow. The run summary
#  says which format was made and why (and, for an old clip, when it can come back).

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      gameplay:
        description: "auto = real gameplay captured now from the stable game, falling back to media/gameplay/ recordings. live = only a fresh capture. curated = only media/gameplay/ recordings."
        required: true
        type: choice
        options:
          - auto
          - live
          - curated
        default: auto
      format:
        description: "auto = new funny clip, else a reusable old one, else gameplay-only. funny = only a funny-clip video (skips if none is due). gameplay = a gameplay-only video."
        required: true
        type: choice
        options:
          - auto
          - funny
          - gameplay
        default: auto
      funny_file:
        description: "Optional: use this clip instead of the next unused one, e.g. media/funny/cat.mp4"
        required: false
        type: string
      allow_reuse:
        description: "Allow a clip that was already made into a video (only together with funny_file). Leave OFF."
        required: false
        type: boolean
        default: false

concurrency:
  group: ringshift-tiktok
  cancel-in-progress: false

permissions:
  contents: read

env:
  GAME_REPOSITORY: ultramegaray0-lgtm/ringshift-game
  GAME_REF: main
  STATE_BRANCH: tiktok-state

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write     # only to push tiktok-state and tiktok-output data branches (never main or media-store)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-tiktok.txt
            requirements-capture.txt

      - name: Install dependencies
        run: pip install -r requirements-tiktok.txt

      - name: Install FFmpeg and a font for the demo card
        timeout-minutes: 16
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core; then break; fi
            echo "Install attempt $attempt failed; retrying in 20 s"; sleep 20
          done
          command -v ffmpeg ffprobe
          ffmpeg -hide_banner -encoders | grep -q libx264

      # The list of clips already used lives on the tiktok-state branch (empty on the very first run).
      - name: Load which clips were already used
        run: |
          header="$(git config --get http.https://github.com/.extraheader || true)"
          RINGSHIFT_STORE_AUTH_HEADER="$header" python scripts/tiktok_state.py pull --to data/tiktok_state.json --branch "$STATE_BRANCH"

      # Says which format this run makes and why. With format auto there is always something to make.
      - name: Decide what to make
        id: check
        env:
          FORMAT: ${{ inputs.format || 'auto' }}
        run: python scripts/tiktok_video.py status --format "$FORMAT"

      # Live gameplay needs a browser and the stable game. Either may fail to install; the run then falls back to the
      # curated recordings (mode auto) and says so in the summary and the metadata.
      - name: Install Chromium for live gameplay
        id: chromium
        if: (steps.check.outputs.eligible == 'true' || inputs.funny_file != '') && inputs.gameplay != 'curated'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip install -r requirements-capture.txt
          for attempt in 1 2 3; do
            if timeout 420 python -m playwright install --with-deps chromium; then break; fi
            echo "Chromium install attempt $attempt failed; retrying in 20 s"; sleep 20
          done
          python -c "from playwright.sync_api import sync_playwright as p; s=p().start(); b=s.chromium.launch(); print('Chromium', b.version); b.close(); s.stop()"

      - name: Check out the game (stable branch, read-only)
        if: (steps.check.outputs.eligible == 'true' || inputs.funny_file != '') && inputs.gameplay != 'curated' && steps.chromium.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAME_REPOSITORY }}
          ref: ${{ env.GAME_REF }}
          path: game-src
          fetch-depth: 1
          persist-credentials: false

      # Inputs reach the script through env, never through the shell text. The script validates the clip path.
      - name: Make the video
        id: make
        if: steps.check.outputs.eligible == 'true' || inputs.funny_file != ''
        timeout-minutes: 30
        env:
          GAMEPLAY: ${{ inputs.gameplay || 'auto' }}
          FORMAT: ${{ inputs.format || 'auto' }}
          FUNNY_FILE: ${{ inputs.funny_file }}
          ALLOW_REUSE: ${{ inputs.allow_reuse && '1' || '0' }}
        run: |
          args=(make --format "$FORMAT" --gameplay "$GAMEPLAY" --out-dir tiktok-out)
          if [ -d game-src ]; then args+=(--game-dir game-src); fi
          if [ -n "$FUNNY_FILE" ]; then args+=(--funny-file "$FUNNY_FILE"); fi
          if [ "$ALLOW_REUSE" = "1" ]; then
            if [ -z "$FUNNY_FILE" ]; then echo "::error::allow_reuse needs funny_file"; exit 1; fi
            args+=(--allow-reuse)
          fi
          python scripts/tiktok_video.py "${args[@]}"

      - name: Nothing to do
        if: steps.check.outputs.eligible != 'true' && inputs.funny_file == ''
        run: echo "No funny-clip video is due and format '${FORMAT}' does not allow a gameplay-only one (see the summary). Nothing was made."
        env:
          FORMAT: ${{ inputs.format || 'auto' }}

      - name: Upload the video (download it from this run's page)
        id: upload
        if: steps.make.outputs.status == 'produced'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.make.outputs.artifact_name }}
          path: |
            ${{ steps.make.outputs.video_file }}
            ${{ steps.make.outputs.metadata_file }}
            ${{ steps.make.outputs.preview_file }}
          retention-days: 30
          if-no-files-found: error

      # Keep finished videos in a dedicated branch as well as the downloadable Actions artifact.
      # The branch is a rolling snapshot (last 30 videos), so its Git history does not grow forever.
      # Nothing is posted to TikTok; this only makes the files visible in the repository's TikTok-Output folder.
      - name: Save finished video to TikTok-Output
        if: steps.make.outputs.status == 'produced' && steps.upload.outcome == 'success'
        env:
          VIDEO_FILE: ${{ steps.make.outputs.video_file }}
          METADATA_FILE: ${{ steps.make.outputs.metadata_file }}
          PREVIEW_FILE: ${{ steps.make.outputs.preview_file }}
          OUTPUT_BRANCH: tiktok-output
        run: |
          set -euo pipefail
          header="$(git config --get http.https://github.com/.extraheader || true)"
          if [ -z "$header" ]; then echo "::error::no GitHub credential available to save TikTok output"; exit 1; fi
          test -s "$VIDEO_FILE"
          test -s "$METADATA_FILE"
          test -s "$PREVIEW_FILE"

          root="$(mktemp -d)"
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$root" "$snapshot"' EXIT
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

          # Fetch the prior output snapshot if it exists. Distinguish a missing branch from an auth/network error.
          set +e
          git -c "http.https://github.com/.extraheader=$header" ls-remote --exit-code --heads "$url" "refs/heads/$OUTPUT_BRANCH" >/dev/null
          branch_status=$?
          set -e
          if [ "$branch_status" -eq 0 ]; then
            git -C "$root" init -q
            git -C "$root" remote add origin "$url"
            git -C "$root" -c "http.https://github.com/.extraheader=$header" fetch -q --depth=1 origin "refs/heads/$OUTPUT_BRANCH"
            git -C "$root" checkout -q --detach FETCH_HEAD
            if [ -d "$root/TikTok-Output" ]; then cp -a "$root/TikTok-Output" "$snapshot/"; fi
          elif [ "$branch_status" -ne 2 ]; then
            echo "::error::could not inspect the $OUTPUT_BRANCH branch (git ls-remote exit $branch_status)"
            exit "$branch_status"
          fi

          mkdir -p "$snapshot/TikTok-Output"
          prefix="run-$(printf '%020d' "$GITHUB_RUN_ID")-attempt-$GITHUB_RUN_ATTEMPT"
          cp "$VIDEO_FILE" "$snapshot/TikTok-Output/$prefix.mp4"
          cp "$METADATA_FILE" "$snapshot/TikTok-Output/$prefix.json"
          cp "$PREVIEW_FILE" "$snapshot/TikTok-Output/$prefix-preview.jpg"
          cat > "$snapshot/TikTok-Output/README.md" <<'EOF'
          # Ringshift TikTok output

          Finished, validated 1080x1920 videos generated by the GitHub Actions workflow.
          Each run stores an MP4, its metadata JSON, and a JPG preview. The newest 30 videos are kept.
          These files are for manual review and upload only. The workflow never publishes to TikTok.
          The downloadable Actions artifact is also retained for 30 days.
          EOF

          # Keep the newest 30 videos and their matching metadata/previews.
          python - "$snapshot/TikTok-Output" <<'PY'
          from pathlib import Path
          import sys
          folder = Path(sys.argv[1])
          videos = sorted(folder.glob("run-*.mp4"), key=lambda p: p.name)
          for old in videos[:-30]:
              prefix = old.stem
              old.unlink()
              for suffix in (".json", "-preview.jpg"):
                  (folder / f"{prefix}{suffix}").unlink(missing_ok=True)
          PY

          git -C "$snapshot" init -q
          git -C "$snapshot" config user.name "github-actions[bot]"
          git -C "$snapshot" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$snapshot" add TikTok-Output
          git -C "$snapshot" commit -q -m "TikTok output: run $GITHUB_RUN_ID"
          git -C "$snapshot" -c "http.https://github.com/.extraheader=$header" push -q --force "$url" "HEAD:refs/heads/$OUTPUT_BRANCH"
          echo "Saved $prefix.mp4 and its metadata/preview to $OUTPUT_BRANCH:TikTok-Output (rolling 30-video snapshot)." >> "$GITHUB_STEP_SUMMARY"

      # A failed run keeps only the metadata (what was tried and which check failed), never a video.
      - name: Upload the failure report
        if: always() && steps.make.outputs.status == 'failed' && steps.make.outputs.metadata_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: ringshift-tiktok-FAILED-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.make.outputs.metadata_file }}
          retention-days: 14
          if-no-files-found: ignore

      # Only runs on main: a test run from another branch does not use up the clip. A produced video is only recorded
      # once its artifact was uploaded; a failure the clip may have caused is recorded so a broken clip stops being
      # retried after 3 attempts (a missing game or a refused duplicate never counts against the clip).
      - name: Save which clips were used (tiktok-state branch)
        if: >-
          always() && github.ref == 'refs/heads/main' &&
          ((steps.make.outputs.status == 'produced' && steps.upload.outcome == 'success') || steps.make.outputs.status == 'failed')
        run: |
          header="$(git config --get http.https://github.com/.extraheader || true)"
          if [ -z "$header" ]; then echo "::error::no credential to push the state branch"; exit 1; fi
          RINGSHIFT_STORE_AUTH_HEADER="$header" python scripts/tiktok_state.py push --from data/tiktok_state.json --branch "$STATE_BRANCH"

      - name: Note when state is not saved
        if: github.ref != 'refs/heads/main' && steps.make.outputs.status == 'produced'
        run: echo "### Test run on ${GITHUB_REF_NAME}; the clip was NOT marked as used (only runs on main do that)." >> "$GITHUB_STEP_SUMMARY"
