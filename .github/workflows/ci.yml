name: CI (offline tests)

# Runs on every pull request and branch push. Read-only token, NO secrets are passed,
# and the test suite blocks all network calls, so this workflow can never publish.
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - media-store

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show FFmpeg (used by the synthetic-clip media tests)
        run: ffmpeg -version | head -1

      - name: Run offline tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      # Only when the tests failed: show the failing tests as annotations and in the job summary (readable on a
      # phone and without downloading the log). Read-only: it just prints what the test run already printed.
      - name: Summarise test failures
        if: failure()
        run: python scripts/ci_failure_summary.py test-output.txt
