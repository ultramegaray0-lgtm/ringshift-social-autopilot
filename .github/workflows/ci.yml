name: CI (offline tests)

# Runs on every pull request and branch push. Read-only token, NO secrets are passed,
# and the test suite blocks all network calls, so this workflow can never publish.
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - media-store

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The runner image no longer ships FFmpeg, and the old check below piped into `head`, which hid the failure,
      # so every FFmpeg test was silently skipped. Install it, then fail loudly if it is still missing.
      - name: Install FFmpeg (used by the synthetic-clip media tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Show FFmpeg
        run: |
          command -v ffmpeg ffprobe
          ffmpeg -version | head -1

      - name: Run offline tests
        env:
          RINGSHIFT_REQUIRE_FFMPEG: "1"      # the full-decode test of the committed media must run, never be skipped
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      # Only when the tests failed: show the failing tests as annotations and in the job summary (readable on a
      # phone and without downloading the log). Read-only: it just prints what the test run already printed.
      - name: Summarise test failures
        if: failure()
        run: python scripts/ci_failure_summary.py test-output.txt
