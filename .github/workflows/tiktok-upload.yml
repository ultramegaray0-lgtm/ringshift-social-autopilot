name: Ringshift TikTok inbox upload

# Sends ONE finished Ringshift video to your TikTok inbox as an editable DRAFT through TikTok's official Content Posting
# API (scope video.upload). It NEVER publishes: you open the TikTok inbox notification, edit, and tap Post yourself.
#
# HOW IT STARTS
#  Automatically: "Ringshift TikTok video" starts it after each video is saved to TikTok-Output, passing the exact
#  run ID and artifact name. By hand: Actions > Ringshift TikTok inbox upload > Run workflow, with the run ID of a
#  "Ringshift TikTok video" run (the artifact name is optional; the run's video artifact is found automatically).
#
# NO DUPLICATES
#  Each upload is recorded by the video's SHA-256 on the tiktok-state branch. A video already sent is skipped (re-runs,
#  retries and a second hand-off never make a second draft) unless you run it by hand with "force" on.
#
# SETUP (once): see docs/TIKTOK_UPLOAD.md. Until the four secrets exist, every run fails with the list of what is missing.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the 'Ringshift TikTok video' run that made the video (the number in its URL)"
        required: true
        type: string
      artifact_name:
        description: "Optional: exact artifact name from that run (found automatically when empty)"
        required: false
        type: string
      force:
        description: "Upload even if this exact video was already sent to the inbox (makes a second draft)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ringshift-tiktok-inbox-upload
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Names only, never values. A missing secret is a clear failure with the exact fix, not a silent skip.
      - name: Check the TikTok setup
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_TOKEN_ENCRYPTION_KEY: ${{ secrets.TIKTOK_TOKEN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET TIKTOK_TOKEN_ENCRYPTION_KEY; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ -z "${TIKTOK_REFRESH_TOKEN:-}" ] && ! git ls-remote --exit-code --heads origin tiktok-auth-state >/dev/null 2>&1; then
            missing+=("TIKTOK_REFRESH_TOKEN")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### TikTok inbox upload: NOT SET UP YET"
              echo ""
              echo "The video is safe in TikTok-Output and in its run's artifact. Nothing was sent to TikTok."
              echo ""
              echo "Missing GitHub secrets (Settings > Secrets and variables > Actions): **${missing[*]}**"
              echo ""
              echo "Follow docs/TIKTOK_UPLOAD.md once, then use **Re-run all jobs** here."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TikTok inbox upload is not set up: missing secret(s) ${missing[*]} (see docs/TIKTOK_UPLOAD.md)"
            exit 1
          fi
          echo "TikTok secrets present."

      - name: Find the video artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then echo "::error::source_run_id must be a run ID (digits only)"; exit 1; fi
          if [ -z "${ARTIFACT_NAME:-}" ]; then
            ARTIFACT_NAME="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false) | select(.name | test("^ringshift-tiktok-[0-9]{8}-"))] | first | .name // ""')"
          fi
          if ! [[ "$ARTIFACT_NAME" =~ ^ringshift-tiktok-[0-9]{8}-[a-z0-9-]+$ ]]; then
            echo "::error::no valid TikTok video artifact in run $SOURCE_RUN_ID (got '${ARTIFACT_NAME}'; artifacts are kept 30 days)"; exit 1
          fi
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "Video: artifact $ARTIFACT_NAME from run $SOURCE_RUN_ID"

      - name: Download the selected video artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: tiktok-artifact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uploader dependency and FFmpeg (to re-check the video)
        timeout-minutes: 12
        run: |
          pip install -r requirements-tiktok-upload.txt
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg; then break; fi
            echo "Install attempt $attempt failed; retrying in 20 s"; sleep 20
          done
          command -v ffmpeg ffprobe

      # The same independent re-check the save job ran: never send an empty, altered or unvalidated file.
      - name: Re-check the video
        id: verify
        run: python scripts/tiktok_output.py verify --dir tiktok-artifact

      # Which videos were already uploaded (the "uploads" record on the tiktok-state branch).
      - name: Load the upload record
        run: |
          set -euo pipefail
          header="$(git config --get http.https://github.com/.extraheader || true)"
          RINGSHIFT_STORE_AUTH_HEADER="$header" python scripts/tiktok_state.py pull --to "$RUNNER_TEMP/tiktok_state.json"

      - name: Load encrypted TikTok refresh-token state
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tiktok-auth"
          if git ls-remote --exit-code --heads origin tiktok-auth-state >/dev/null 2>&1; then
            git fetch --depth=1 origin tiktok-auth-state
            git show FETCH_HEAD:tiktok_auth_state.enc > "$RUNNER_TEMP/tiktok-auth/tiktok_auth_state.enc"
          fi

      - name: Upload video to TikTok inbox as a draft
        id: upload
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_TOKEN_ENCRYPTION_KEY: ${{ secrets.TIKTOK_TOKEN_ENCRYPTION_KEY }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set -euo pipefail
          video="$(find tiktok-artifact -maxdepth 2 -type f -name '*.mp4' -print -quit)"
          metadata="${video%.mp4}.json"
          test -n "$video" && test -s "$metadata"
          args=(--video "$video" --metadata "$metadata" --state "$RUNNER_TEMP/tiktok-auth/tiktok_auth_state.enc"
                --ledger "$RUNNER_TEMP/tiktok_state.json" --result "$RUNNER_TEMP/tiktok_upload_result.json"
                --source-run-id "$SOURCE_RUN_ID" --artifact-name "$ARTIFACT_NAME")
          if [ "$FORCE" = "1" ]; then args+=(--force); fi
          python scripts/tiktok_upload.py "${args[@]}"

      # Recorded even when the status check failed after TikTok accepted the bytes, so a re-run never duplicates it.
      - name: Record the upload (tiktok-state branch)
        if: always() && steps.upload.outcome != 'skipped'
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/tiktok_upload_result.json"
          if [ ! -s "$result" ] || grep -q '"ALREADY_UPLOADED"' "$result"; then echo "Nothing new to record."; exit 0; fi
          header="$(git config --get http.https://github.com/.extraheader || true)"
          RINGSHIFT_STORE_AUTH_HEADER="$header" python scripts/tiktok_state.py push --from "$RUNNER_TEMP/tiktok_state.json"

      - name: Save rotated refresh token (encrypted) on its isolated branch
        if: always() && steps.upload.outcome != 'skipped'
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/tiktok-auth/tiktok_auth_state.enc"
          if [ ! -s "$state" ]; then echo "No token state to save (the token was not refreshed)."; exit 0; fi
          git fetch origin tiktok-auth-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/tiktok-auth-state; then
            git checkout -B tiktok-auth-state origin/tiktok-auth-state
          else
            git checkout --orphan tiktok-auth-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$state" tiktok_auth_state.enc
          git add tiktok_auth_state.enc
          if git diff --cached --quiet; then echo "Token state unchanged."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Rotate encrypted TikTok refresh token"
          git push origin tiktok-auth-state
