name: Ringshift AI Autopilot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ringshift-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Update X analytics
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/analytics.py

      - name: Run Ringshift autopilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/autopilot.py

      - name: Save generated content and analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/generated_posts.md data/analytics.md data/post_counter.json data/media_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update AI social content and analytics"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed. Syncing with origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Push failed after 5 attempts."
          exit 1
