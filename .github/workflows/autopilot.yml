
name: Ringshift AI Autopilot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Test media selection or publish a real post"
        required: true
        type: choice
        options:
          - test
          - live
        default: test

concurrency:
  group: ringshift-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Test media selection only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from media_selector import select_media

          tests = [
              "A challenging black hole portal puzzle",
              "Discover the prism mechanism",
          ]

          for post in tests:
              print("\nTest post:", post)
              media = select_media(post)
              print("Selected file:", media.get("file"))
              print("Media type:", media.get("type"))
              print("Match:", media.get("match"))
              print("Detected topics:", media.get("topics"))
              print("Public URL:", media.get("url"))

              if not media.get("url") or media.get("type") not in ("image", "video"):
                  raise SystemExit("FAIL: media selection returned invalid data")

          print("\nPASS: media selection returned an image/video for both tests.")
          print("No Buffer post was created.")
          PY

      - name: Update X analytics
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/analytics.py

      - name: Run Ringshift autopilot
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/autopilot.py

      - name: Save generated content and analytics
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/generated_posts.md data/analytics.md data/post_counter.json data/media_history.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update AI social content and analytics"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed. Syncing with origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Push failed after 5 attempts."
          exit 1
