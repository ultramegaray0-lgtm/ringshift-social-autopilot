name: Ringshift AI Autopilot

# WHAT RUNS BY ITSELF
#  - Every day at 06:00 UTC (09:00 Riyadh) the schedule makes ONE fresh piece of real gameplay media from the stable
#    game (repository ringshift-game, branch main), writes a post about it with Gemini, runs every existing check
#    (post rules, game vocabulary, near-duplicates, the evidence-checked critic, the media gate) and, if all pass,
#    queues it in Buffer through exactly the same verified path as "publish-approved". Buffer posts it to X at its next
#    queue slot. At most one post per Riyadh day (a ringshift-day-YYYY-MM-DD tag), never while Buffer has one waiting.
#  - A catch-up schedule at 13:37 UTC (16:37 Riyadh) does the same ONLY if no post was queued that day (for example the
#    morning run was delayed, dropped by GitHub, or failed on a transient error). Otherwise it stops after one check.
#  - Kill switch: set the repository variable RINGSHIFT_AUTOPUBLISH to "off" (Settings > Secrets and variables >
#    Actions > Variables). The schedule then only writes a draft that you approve with "publish-approved", as before.
#    To stop everything: Actions > Ringshift AI Autopilot > ... > Disable workflow.

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "37 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = pick media only. preview = write a draft, nothing is sent. daily = run exactly what the schedule runs now (fresh media + the unattended post, at most one per day). daily-dry-run = the same fresh capture, caption and critic, but only a draft: nothing is sent. rehearse-approval = check an approval code WITHOUT publishing. publish-approved = queue ONE REAL post: exactly the draft you approve below."
        required: true
        type: choice
        options:
          - test
          - preview
          - daily
          - daily-dry-run
          - rehearse-approval
          - publish-approved
        default: test
      approval_code:
        description: "publish-approved / rehearse-approval: the draft ID shown in the draft's summary (like d-1a2b3c4d-5e6f). For publish-approved, typing it is your approval."
        required: false
        type: string
      media_file:
        description: "preview only (optional): write the draft about this committed file, like media/gameplay/06_hard15_five_mechanisms.png. All media checks still apply; if it does not fit or fails one, there is no draft. Leave empty for the normal rotation."
        required: false
        type: string
      allow_extra_post:
        description: "publish-approved only: post even if Buffer already has a waiting post or one was queued in the last 12h. Leave OFF."
        required: false
        type: boolean
        default: false

# One run at a time for the whole workflow (scheduled, preview, test and publish runs share this group).
# A run that starts while another is active WAITS; it never runs in parallel, and it is never
# cancelled mid-publish. (GitHub keeps only one waiting run, replacing an older waiting one.)
concurrency:
  group: ringshift-autopilot
  cancel-in-progress: false

permissions:
  contents: read

env:
  GAME_REPOSITORY: ultramegaray0-lgtm/ringshift-game
  GAME_REF: main

jobs:
  # Offline safety gate: no secrets, read-only token, every network call mocked.
  # The autopilot job below only starts if this passes, so a broken build cannot publish.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run offline tests (no network, no secrets)
        run: python -m unittest discover -s tests -v

  autopilot:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write     # commit the state files, push new media to the media-store branch, claim tags
      actions: read       # download the approved draft artifact from the preview run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Which path this run takes. "daily" is the schedule (both crons) or a manual mode "daily".
      - name: Decide what this run does
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          AUTOPUBLISH: ${{ vars.RINGSHIFT_AUTOPUBLISH }}
          CRON: ${{ github.event.schedule }}
        run: |
          daily=false
          if [ "$EVENT" = "schedule" ] || [ "$MODE" = "daily" ] || [ "$MODE" = "daily-dry-run" ]; then daily=true; fi
          auto=on
          case "$(printf '%s' "${AUTOPUBLISH:-on}" | tr '[:upper:]' '[:lower:]')" in off|0|false|no|disabled|draft-only) auto=off;; esac
          # The dry run is the daily path with publishing switched off: fresh capture, caption, critic, a draft, no post.
          if [ "$MODE" = "daily-dry-run" ]; then auto=off; fi
          # With auto-publish off the catch-up schedule has nothing to catch up on: one draft a day is enough.
          if [ "$daily" = true ] && [ "$auto" = off ] && [ "$CRON" = "37 13 * * *" ]; then daily=false; fi
          echo "daily=$daily" >> "$GITHUB_OUTPUT"
          echo "autopublish=$auto" >> "$GITHUB_OUTPUT"
          echo "Daily path: $daily; auto-publish: $auto; trigger: $EVENT ${CRON:-$MODE}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-capture.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The media check decodes the exact bytes it is about to post (FFmpeg). The runner image does not ship FFmpeg, and
      # without it the check can only rely on the committed manifest, so install it. Uses no secrets; if the install fails
      # the run stops here, before any key is used.
      - name: Install FFmpeg (decodes the media before a draft or a post)
        timeout-minutes: 16
        run: |
          # Package mirrors occasionally stall; bounded attempts instead of one install that can hang the job.
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg; then break; fi
            echo "FFmpeg install attempt $attempt failed; retrying in 20 s"; sleep 20
          done
          command -v ffmpeg ffprobe

      # Publishing commits to main, so it must run main's code. Stops before any key is used.
      - name: Publishing only runs from main
        if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'publish-approved' || inputs.mode == 'daily' || inputs.mode == 'daily-dry-run')) && github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish-approved, daily and daily-dry-run commit to main, so they must be dispatched on the main branch (this run is on ${GITHUB_REF})."
          exit 1

      # Reject a malformed approval code immediately, before any download or key. Inputs go through env, never into the shell text.
      - name: Check the approval code
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'publish-approved' || inputs.mode == 'rehearse-approval')
        env:
          APPROVAL_CODE: ${{ inputs.approval_code }}
        run: |
          if ! printf '%s' "$APPROVAL_CODE" | grep -Eq '^d-[0-9a-f]{8}-[0-9a-f]{4}$'; then
            echo "::error::approval_code must be the draft ID from the preview summary, like d-1a2b3c4d-5e6f."; exit 1
          fi

      # A pinned file is only for a preview draft. Refuse it elsewhere, before any key is used, so nobody
      # believes a rehearsal, publish or daily run was restricted to it.
      - name: Check the media pin is only used for a preview
        if: github.event_name == 'workflow_dispatch' && inputs.media_file != '' && inputs.mode != 'preview'
        run: |
          echo "::error::media_file is only used by mode preview. Clear it, or use mode preview."; exit 1

      - name: Test media selection only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from media_selector import select_media

          tests = [
              "A challenging black hole portal puzzle",
              "Discover the prism mechanism",
          ]

          for post in tests:
              print("\nTest post:", post)
              media = select_media(post)
              print("Selected file:", media.get("file"))
              print("Media type:", media.get("type"))
              print("Match:", media.get("match"))
              print("Detected topics:", media.get("topics"))
              print("Public URL:", media.get("url"))

              if not media.get("url") or media.get("type") not in ("image", "video"):
                  raise SystemExit("FAIL: media selection returned invalid data")

          print("\nPASS: media selection returned an image/video for both tests.")
          print("No Buffer post was created.")
          PY

      # ---------------------------------------------------------------- the daily path (schedule / mode daily)

      # Read-only: is today's post still to be made? (Day tag, 12 h spacing, nothing waiting in Buffer.) If not, the
      # run stops here: no capture, no Gemini call, no post. This is what makes the catch-up schedule and re-runs safe.
      - name: Check today's post window
        id: window
        if: steps.plan.outputs.daily == 'true' && steps.plan.outputs.autopublish == 'on'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/autopilot.py --check-publish-window

      - name: Install Chromium for the real game
        if: steps.plan.outputs.daily == 'true' && (steps.plan.outputs.autopublish == 'off' || steps.window.outputs.should_post == 'true')
        timeout-minutes: 20
        run: |
          pip install -r requirements-capture.txt
          for attempt in 1 2 3; do
            if timeout 420 python -m playwright install --with-deps chromium; then break; fi
            echo "Chromium install attempt $attempt failed; retrying in 20 s"; sleep 20
          done
          python -c "from playwright.sync_api import sync_playwright as p; s=p().start(); b=s.chromium.launch(); print('Chromium', b.version); b.close(); s.stop()"

      # The stable game, read-only (the repository is public; no token is used or needed).
      - name: Check out the game (stable branch)
        if: steps.plan.outputs.daily == 'true' && (steps.plan.outputs.autopublish == 'off' || steps.window.outputs.should_post == 'true')
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAME_REPOSITORY }}
          ref: ${{ env.GAME_REF }}
          path: game-src
          fetch-depth: 1
          persist-credentials: false

      # Plays the real game, validates the file and hosts it on the media-store branch of THIS repository. That push
      # happens from a temporary clone, so the step hands it the credential actions/checkout set up for this checkout
      # (this job's GITHUB_TOKEN), for those git processes only.
      - name: Capture fresh gameplay media from the real game
        id: media
        if: steps.plan.outputs.daily == 'true' && (steps.plan.outputs.autopublish == 'off' || steps.window.outputs.should_post == 'true')
        timeout-minutes: 20
        run: |
          header="$(git config --get http.https://github.com/.extraheader || true)"
          if [ -z "$header" ]; then
            echo "::error::actions/checkout left no credential for pushing to the media-store branch; no media can be hosted."; exit 1
          fi
          RINGSHIFT_STORE_AUTH_HEADER="$header" python scripts/daily_media.py --game-dir game-src

      # Writes the post about the fresh file and, unless RINGSHIFT_AUTOPUBLISH is off, publishes it through the
      # approved-draft checks. Fails the run if nothing was queued (except when auto-publish is switched off).
      - name: Write and publish today's post
        if: steps.plan.outputs.daily == 'true' && steps.media.outputs.status == 'captured'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RINGSHIFT_AUTOPUBLISH: ${{ steps.plan.outputs.autopublish }}
          DAILY_MEDIA: ${{ steps.media.outputs.media_file }}
        run: >
          python scripts/autopilot.py --auto-publish
          --draft-file preview_draft.json
          --media-file "$DAILY_MEDIA"
          --result-file auto_result.json

      # ---------------------------------------------------------------- preview / approval path

      # Writes a draft post (text + the media it would use). Used by mode "preview".
      # Needs only the Gemini key: this step has no Buffer key, so it cannot publish. Nothing is committed.
      - name: Generate a draft (nothing is sent)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEDIA_FILE: ${{ inputs.media_file }}      # empty unless pinned; the path is validated by the script
        run: |
          if [ -n "$MEDIA_FILE" ]; then
            python scripts/autopilot.py --dry-run --draft-file preview_draft.json --media-file "$MEDIA_FILE"
          else
            python scripts/autopilot.py --dry-run --draft-file preview_draft.json
          fi

      # The artifact is named after the draft ID, so a publish run can find it from the approval code alone.
      - name: Read the draft ID
        id: draft
        if: always() && (steps.plan.outputs.daily == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'))
        run: |
          if [ -f preview_draft.json ]; then
            python -c "import json;print('draft_id='+(json.load(open('preview_draft.json')).get('draft_id') or ''))" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the draft as a downloadable artifact
        if: always() && steps.draft.outputs.draft_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: ringshift-draft-${{ steps.draft.outputs.draft_id }}
          path: preview_draft.json
          retention-days: 14
          if-no-files-found: error

      - name: Save the preview report (no draft was produced)
        if: always() && (steps.plan.outputs.daily == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview')) && steps.draft.outputs.draft_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: ringshift-preview-report
          path: preview_draft.json
          retention-days: 14
          if-no-files-found: ignore

      # Finds the ONE unexpired artifact named after the approval code, and the run that made it.
      - name: Find the approved draft
        id: find
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'publish-approved' || inputs.mode == 'rehearse-approval')
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_CODE: ${{ inputs.approval_code }}
        run: |
          found=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ringshift-draft-${APPROVAL_CODE}&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false)] | map(.workflow_run.id) | unique | .[]')
          count=$(printf "%s\n" "$found" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly one unexpired draft for ${APPROVAL_CODE}, found ${count}. Run a new preview."; exit 1
          fi
          echo "run_id=${found}" >> "$GITHUB_OUTPUT"

      - name: Download the approved draft
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'publish-approved' || inputs.mode == 'rehearse-approval')
        uses: actions/download-artifact@v4
        with:
          name: ringshift-draft-${{ inputs.approval_code }}
          path: approved
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      # Runs the approval checks on the downloaded draft and the claim mechanism on a throwaway tag.
      # No Buffer key, no Gemini key; it claims and sends nothing for the real draft.
      - name: Rehearse the approval (nothing is published)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rehearse-approval'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRAFT_RUN_ID: ${{ steps.find.outputs.run_id }}
          APPROVAL_CODE: ${{ inputs.approval_code }}
        run: |
          python scripts/autopilot.py --verify-approved approved/preview_draft.json --approval-code "$APPROVAL_CODE" --expected-run-id "$DRAFT_RUN_ID"
          python scripts/autopilot.py --rehearse-claims

      # Read-only: scripts/analytics.py only runs a GraphQL query. (A test fails if it ever contains a mutation.)
      - name: Update X analytics
        if: always() && (steps.plan.outputs.daily == 'true' || inputs.mode == 'publish-approved')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python scripts/analytics.py
          python scripts/report.py > /dev/null

      # Manual publishing: exactly the approved draft, once. No Gemini key is given to this step.
      - name: Publish the approved draft
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-approved'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RINGSHIFT_ALLOW_EXTRA_POST: ${{ inputs.allow_extra_post && '1' || '0' }}
          DRAFT_RUN_ID: ${{ steps.find.outputs.run_id }}
          APPROVAL_CODE: ${{ inputs.approval_code }}
        run: >
          python scripts/autopilot.py
          --publish-approved approved/preview_draft.json
          --approval-code "$APPROVAL_CODE"
          --expected-run-id "$DRAFT_RUN_ID"

      # If the push below fails after a post was queued, the state files are still recoverable here.
      - name: Keep a copy of the state files
        if: always() && (steps.plan.outputs.daily == 'true' || inputs.mode == 'publish-approved')
        uses: actions/upload-artifact@v4
        with:
          name: ringshift-state
          path: |
            data/post_log.json
            data/post_counter.json
            data/media_history.json
            data/daily_media.json
            data/capture_history.json
            media/manifest.json
            media/media_tags.json
            content/generated_posts.md
            auto_result.json
          retention-days: 30
          if-no-files-found: ignore

      # Runs even when an earlier step failed, so a failed day is recorded and new media is never orphaned.
      - name: Save generated content and analytics
        if: always() && (steps.plan.outputs.daily == 'true' || inputs.mode == 'publish-approved')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in content/generated_posts.md data/analytics.md data/metrics.json data/report.md \
                   data/post_counter.json data/media_history.json data/post_log.json \
                   data/daily_media.json data/capture_history.json media/manifest.json media/media_tags.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update AI social content and analytics"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed. Syncing with origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Push failed after 5 attempts."
          exit 1

      # One table at the top of the run page: what was captured, checked, written and queued, and what failed.
      - name: Run summary
        if: always() && steps.plan.outputs.daily == 'true'
        env:
          WINDOW_OK: ${{ steps.window.outputs.should_post }}
          WINDOW_REASON: ${{ steps.window.outputs.window_reason }}
          AUTOPUBLISH: ${{ steps.plan.outputs.autopublish }}
          MEDIA_STATUS: ${{ steps.media.outcome }}
          POST_STATUS: ${{ job.status }}
        run: python scripts/run_summary.py
