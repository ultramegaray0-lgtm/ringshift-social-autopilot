
name: Ringshift AI Autopilot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = pick media only (no keys). preview = write a post with Gemini and show it, nothing saved or sent. live = queue a REAL post in Buffer."
        required: true
        type: choice
        options:
          - test
          - preview
          - live
        default: test

concurrency:
  group: ringshift-autopilot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Offline safety gate: no secrets, read-only token, every network call mocked.
  # The autopilot job below only starts if this passes, so a broken build cannot publish.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run offline tests (no network, no secrets)
        run: python -m unittest discover -s tests -v

  autopilot:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test media selection only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from media_selector import select_media

          tests = [
              "A challenging black hole portal puzzle",
              "Discover the prism mechanism",
          ]

          for post in tests:
              print("\nTest post:", post)
              media = select_media(post)
              print("Selected file:", media.get("file"))
              print("Media type:", media.get("type"))
              print("Match:", media.get("match"))
              print("Detected topics:", media.get("topics"))
              print("Public URL:", media.get("url"))

              if not media.get("url") or media.get("type") not in ("image", "video"):
                  raise SystemExit("FAIL: media selection returned invalid data")

          print("\nPASS: media selection returned an image/video for both tests.")
          print("No Buffer post was created.")
          PY

      # Writes a draft post (text + the media it would use) to the run summary.
      # Needs only the Gemini key. Nothing is saved, committed, or sent to Buffer.
      - name: Preview a post (no publishing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/autopilot.py --dry-run

      - name: Update X analytics
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python scripts/analytics.py
          python scripts/report.py > /dev/null

      - name: Run Ringshift autopilot
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/autopilot.py

      - name: Save generated content and analytics
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in content/generated_posts.md data/analytics.md data/metrics.json data/report.md \
                   data/post_counter.json data/media_history.json data/post_log.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update AI social content and analytics"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed. Syncing with origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Push failed after 5 attempts."
          exit 1
