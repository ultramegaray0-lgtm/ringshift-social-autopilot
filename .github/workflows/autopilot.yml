name: Ringshift AI Autopilot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  autopilot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Run Ringshift autopilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/autopilot.py

      - name: Save generated post history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated_posts.md
          git diff --cached --quiet || git commit -m "Update AI post history"
          git push
