name: Ringshift itch stats

# Once a day: snapshot the itch.io page's own counters (views, downloads/plays) into data/itch_stats.json and rebuild
# data/campaign/REPORT.md. Read-only towards itch.io; posts nothing anywhere. Without the ITCH_API_KEY secret it
# records nothing and the report says "unavailable".
#
# Separate from the X autopilot: own concurrency group; it only ever changes data/itch_stats.json and
# data/campaign/REPORT.md.

on:
  schedule:
    - cron: "17 3 * * *"        # 06:17 Riyadh, before the X autopilot's 09:00 run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ringshift-itch-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Snapshot itch.io counters
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: python scripts/itch_stats.py
      - name: Rebuild campaign report
        run: |
          python scripts/campaign_report.py
          cat data/campaign/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "ringshift-itch-stats"
          git config user.email "actions@users.noreply.github.com"
          git add data/itch_stats.json data/campaign/REPORT.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "itch stats + campaign report $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the stats commit after 3 attempts."; exit 1
